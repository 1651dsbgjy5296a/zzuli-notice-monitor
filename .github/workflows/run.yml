name: zzuli-notice
on:
  schedule:
    # UTC时间，北京时间09:30 = UTC 01:30
    - cron: "30 1 * * *"
  workflow_dispatch: #支持手动点击测试运行
jobs:
  run-task:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: 安装python依赖
        run: |
          pip install requests beautifulsoup4
      - name: 执行通知抓取脚本
        env:
          SERVERCHAN_SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: python zzuli_notice.py
      - name: 保存历史记录
        uses: actions/upload-artifact@v4
        with:
          name: history-record
          path: history.json
